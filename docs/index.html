<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADRC | Publications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --usc-cardinal: #990000;
      --usc-gold: #ffcc00;
      --text: #2c2c2c;
      --muted: #555;
      --border: #ccc;
      --row-alt: #f9f9f9;
      --link: #0066cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      line-height: 1.5;
    }

    /* Top bar — USC ADRC style */
    .site-header {
      background: var(--usc-cardinal);
      color: #fff;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .site-header .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .site-header .brand span {
      font-weight: 400;
      opacity: 0.85;
    }

    .site-header nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .site-header nav a:hover { opacity: 1; text-decoration: underline; }

    .page-banner {
      background: #f5f5f5;
      border-bottom: 3px solid var(--usc-gold);
      padding: 2rem;
    }

    .page-banner h1 {
      max-width: 1200px;
      margin: 0 auto;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    /* Filter bar — matches ADRC layout */
    .filters {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 1rem;
      align-items: end;
      margin-bottom: 1rem;
    }

    .filter-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      font: inherit;
      background: #fff;
    }

    .filter-group.year-range {
      display: flex;
      gap: 0.5rem;
      align-items: end;
    }

    .filter-group.year-range .field { flex: 1; }

    .btn {
      padding: 0.45rem 1rem;
      border: 1px solid var(--usc-cardinal);
      background: var(--usc-cardinal);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { background: #7a0000; }
    .btn:disabled { opacity: 0.55; cursor: wait; }

    /* Publications table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    table.publications {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    table.publications thead {
      background: #eee;
      border-bottom: 2px solid var(--border);
    }

    table.publications th {
      text-align: left;
      padding: 0.65rem 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    table.publications td {
      padding: 0.75rem 0.85rem;
      vertical-align: top;
      border-bottom: 1px solid #e0e0e0;
    }

    table.publications tbody tr:nth-child(even) {
      background: var(--row-alt);
    }

    table.publications tbody tr:hover {
      background: #f0f4fa;
    }

    td.col-year {
      width: 60px;
      font-weight: 600;
      white-space: nowrap;
    }

    td.col-title { min-width: 220px; }

    td.col-authors {
      min-width: 180px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    td.col-journal {
      min-width: 160px;
      font-size: 0.88rem;
    }

    a.pub-link {
      color: var(--link);
      text-decoration: none;
    }

    a.pub-link:hover {
      text-decoration: underline;
      color: var(--usc-cardinal);
    }

    /* Pagination */
    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .pagination button,
    .pagination span {
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font: inherit;
    }

    .pagination button:hover:not(:disabled) { background: #eee; }
    .pagination button.active {
      background: var(--usc-cardinal);
      color: #fff;
      border-color: var(--usc-cardinal);
    }
    .pagination button:disabled { opacity: 0.4; cursor: default; }

    .loading, .error, .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .error { color: #990000; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #ddd;
      border-top-color: var(--usc-cardinal);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      background: #f5f5f5;
      border-top: 1px solid var(--border);
      padding: 1.25rem 2rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    footer a { color: var(--link); }

    @media (max-width: 768px) {
      .filters { grid-template-columns: 1fr; }
      .site-header nav { display: none; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">USC ADRC <span>| Alzheimer's Disease Research Center</span></div>
    <nav>
      <a href="https://adrc.usc.edu/" target="_blank" rel="noopener noreferrer">ADRC Home</a>
    </nav>
  </header>

  <div class="page-banner">
    <h1>Publications</h1>
  </div>

  <div class="container">
    <div class="filters">
      <div class="filter-group">
        <label for="keyword-filter">Keywords</label>
        <input type="search" id="keyword-filter" placeholder="Search title, authors, journal…">
      </div>
      <div class="filter-group year-range">
        <div class="field">
          <label for="year-from">Year Range</label>
          <select id="year-from"><option value="">From</option></select>
        </div>
        <div class="field">
          <label for="year-to">&nbsp;</label>
          <select id="year-to"><option value="">To</option></select>
        </div>
      </div>
      <div class="filter-group">
        <label for="author-filter">ADRC Author</label>
        <select id="author-filter"><option value="">All authors</option></select>
      </div>
      </div>

    <hr class="divider">

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading publications…</p>
      </div>
    </div>

    <div class="pagination" id="pagination" hidden></div>
  </div>

  <footer>
    Live feed from <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener noreferrer">PubMed</a>
    · 22 ADRC investigators · 67 research keywords
    · <span id="last-updated">—</span>
  </footer>

  <script>
    const PAGE_SIZE = 20;
    let allPublications = [];
    let filteredPublications = [];
    let currentPage = 1;

    const content = document.getElementById("content");
    const keywordFilter = document.getElementById("keyword-filter");
    const yearFrom = document.getElementById("year-from");
    const yearTo = document.getElementById("year-to");
    const authorFilter = document.getElementById("author-filter");
    const refreshBtn = document.getElementById("refresh-btn");
    const pagination = document.getElementById("pagination");
    const lastUpdated = document.getElementById("last-updated");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function getYear(pub) {
      return pub.pub_date ? pub.pub_date.slice(0, 4) : "";
    }

    function formatAuthors(authors) {
      if (!authors || !authors.length) return "";
      return authors.join("; ");
    }

    function pubmedUrl(pmid) {
      if (!pmid) return null;
      return "https://pubmed.ncbi.nlm.nih.gov/" + String(pmid).trim() + "/";
    }

    function titleUrl(pub) {
      if (pub.pmc_url) return pub.pmc_url;
      if (pub.title_url) return pub.title_url;
      return pubmedUrl(pub.pmid);
    }

    function makeLink(href, text) {
      if (!href) return escapeHtml(text);
      const a = document.createElement("a");
      a.className = "pub-link";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = text;
      return a.outerHTML;
    }

    function renderTable(pubs) {
      if (!pubs.length) {
        content.innerHTML = '<div class="empty"><p>No publications match your filters.</p></div>';
        pagination.hidden = true;
        return;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = pubs.slice(start, start + PAGE_SIZE);

      let rows = "";
      for (const pub of pageItems) {
        const year = getYear(pub) || "—";
        const titleHref = titleUrl(pub);
        const journalHref = pubmedUrl(pub.pmid);
        const titleCell = titleHref
          ? makeLink(titleHref, pub.title || "Untitled")
          : escapeHtml(pub.title || "Untitled");
        const journalCell = journalHref
          ? makeLink(journalHref, pub.journal || "—")
          : escapeHtml(pub.journal || "—");

        rows += `<tr>
          <td class="col-year">${escapeHtml(year)}</td>
          <td class="col-title">${titleCell}</td>
          <td class="col-authors">${escapeHtml(formatAuthors(pub.authors))}</td>
          <td class="col-journal">${journalCell}</td>
        </tr>`;
      }

      content.innerHTML = `
        <div class="table-wrap">
          <table class="publications">
            <thead>
              <tr>
                <th>Year</th>
                <th>Title</th>
                <th>Authors</th>
                <th>Journal/Publication</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;

      renderPagination(pubs.length);
    }

    function renderPagination(total) {
      const totalPages = Math.ceil(total / PAGE_SIZE);
      if (totalPages <= 1) {
        pagination.hidden = true;
        return;
      }
      pagination.hidden = false;

      let html = "";
      if (currentPage > 1) {
        html += `<button data-page="${currentPage - 1}">Previous</button>`;
      }

      const maxButtons = 7;
      let startPage = Math.max(1, currentPage - 3);
      let endPage = Math.min(totalPages, startPage + maxButtons - 1);
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        html += `<button data-page="${i}" class="${i === currentPage ? "active" : ""}">${i}</button>`;
      }

      if (currentPage < totalPages) {
        html += `<button data-page="${currentPage + 1}">Next Page</button>`;
        html += `<button data-page="${totalPages}">Last Page</button>`;
      }

      pagination.innerHTML = html;
    }

    pagination.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-page]");
      if (!btn) return;
      currentPage = parseInt(btn.dataset.page, 10);
      renderTable(filteredPublications);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function applyFilters() {
      const q = keywordFilter.value.toLowerCase().trim();
      const author = authorFilter.value;
      const from = yearFrom.value;
      const to = yearTo.value;

      filteredPublications = allPublications.filter((pub) => {
        const year = getYear(pub);
        if (author && !(pub.adrc_authors || []).includes(author)) return false;
        if (from && year && year < from) return false;
        if (to && year && year > to) return false;
        if (q) {
          const hay = [
            pub.title, pub.journal, pub.abstract,
            ...(pub.authors || []),
            ...(pub.adrc_authors || []),
            ...(pub.matched_keywords || [])
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      currentPage = 1;
      renderTable(filteredPublications);
    }

    function populateFilters(data) {
      const years = [...new Set(
        data.publications.map((p) => getYear(p)).filter(Boolean)
      )].sort((a, b) => b.localeCompare(a));

      yearFrom.innerHTML = '<option value="">From</option>';
      yearTo.innerHTML = '<option value="">To</option>';
      for (const y of years) {
        yearFrom.innerHTML += `<option value="${y}">${y}</option>`;
        yearTo.innerHTML += `<option value="${y}">${y}</option>`;
      }

      const authors = [...new Set(
        data.publications.flatMap((p) => p.adrc_authors || [])
      )].sort();

      authorFilter.innerHTML = '<option value="">All authors</option>';
      for (const name of authors) {
        authorFilter.innerHTML += `<option value="${escapeHtml(name)}">${escapeHtml(name.split(",")[0])}</option>`;
      }
    }

    function formatFetchedAt(iso) {
      if (!iso) return "Unknown";
      return "Updated " + new Date(iso).toLocaleString("en-US", {
        month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit"
      });
    }

    async function loadPublications() {
      if (!allPublications.length) {
        content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading publications…</p></div>';
      }

      try {
        const url = "publications.json";
        const res = await fetch(url);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        allPublications = data.publications || [];
        lastUpdated.textContent = formatFetchedAt(data.fetched_at);
        populateFilters(data);
        applyFilters();
      } catch (err) {
        content.innerHTML = `<div class="error"><p>Failed to load: ${escapeHtml(err.message)}</p></div>`;
      } finally {
      }
    }

    keywordFilter.addEventListener("input", applyFilters);
    yearFrom.addEventListener("change", applyFilters);
    yearTo.addEventListener("change", applyFilters);
    authorFilter.addEventListener("change", applyFilters);

    loadPublications();
  </script>
</body>
</html>
